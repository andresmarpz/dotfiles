# Sandcastle Light - tmux status bar colors

set -g status-style "bg=#faf5ee,fg=#3a3630"

# Left: session name
set -g status-left "#[fg=#faf5ee,bg=#2a7ab5,bold] #S #[fg=#2a7ab5,bg=#faf5ee]"

# Right: time
set -g status-right "#[fg=#ece7e0]#[fg=#3a3630,bg=#ece7e0] %H:%M #[fg=#2a7ab5]#[fg=#faf5ee,bg=#2a7ab5,bold] #h "

# Window tabs
set -g window-status-format "#[fg=#7a756c] #I:#W "
set -g window-status-current-format "#[fg=#faf5ee,bg=#2a7ab5,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#b0a99e"
set -g pane-active-border-style "fg=#2a7ab5"

# Messages
set -g message-style "fg=#3a3630,bg=#ece7e0"
set -g message-command-style "fg=#3a3630,bg=#ece7e0"
