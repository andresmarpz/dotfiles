# Sandcastle Dark - tmux status bar colors

set -g status-style "bg=#030303,fg=#e0cfc2"

# Left: session name
set -g status-left "#[fg=#030303,bg=#5c91dd,bold] #S #[fg=#5c91dd,bg=#030303]"

# Right: time
set -g status-right "#[fg=#333333]#[fg=#e0cfc2,bg=#333333] %H:%M #[fg=#5c91dd]#[fg=#030303,bg=#5c91dd,bold] #h "

# Window tabs
set -g window-status-format "#[fg=#867268] #I:#W "
set -g window-status-current-format "#[fg=#030303,bg=#5c91dd,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#5c91dd"

# Messages
set -g message-style "fg=#e0cfc2,bg=#333333"
set -g message-command-style "fg=#e0cfc2,bg=#333333"
