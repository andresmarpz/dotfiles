# ============================================
# Tmux Config - VSCode-like keybinds
# ============================================
# Hierarchy:
#   Session = Project (sandcastle, other-project)
#   Window  = Context (lazygit, claude, dev-servers)
#   Pane    = Splits within a window

# ============================================
# General Settings
# ============================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on

# ============================================
# Prefix Key: Ctrl+Space
# ============================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ============================================
# Reload config
# ============================================
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ============================================
# Pane Splits (VSCode-style)
# ============================================
# prefix + \ = vertical split (side by side)
# prefix + - = horizontal split (stacked)
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Close pane
bind x kill-pane

# ============================================
# Pane Navigation
# ============================================
# Alt+arrows (no prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Also vim-style with prefix
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# ============================================
# Pane Resizing
# ============================================
# Ctrl+Shift+arrows (no prefix needed!)
bind -n C-S-Left resize-pane -L 3
bind -n C-S-Right resize-pane -R 3
bind -n C-S-Up resize-pane -U 3
bind -n C-S-Down resize-pane -D 3

# Or with prefix + HJKL for larger jumps
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# Zoom pane (toggle fullscreen)
bind z resize-pane -Z

# ============================================
# Window Management (your "sub-tabs")
# ============================================
bind c new-window -c "#{pane_current_path}"
bind , command-prompt "rename-window '%%'"

# Alt+number to switch windows (no prefix!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift+arrows to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# ============================================
# Session Management (your "projects")
# ============================================
bind N new-session
bind $ command-prompt "rename-session '%%'"
bind s choose-tree -Zs  # session picker

# Quick session switching
bind ( switch-client -p
bind ) switch-client -n

# ============================================
# Copy Mode (vim-style)
# ============================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ============================================
# Status Bar
# ============================================
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"

# Right: time
set -g status-right-length 50
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a] %H:%M #[fg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #h "

# Window tabs
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# ============================================
# Messages
# ============================================
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
