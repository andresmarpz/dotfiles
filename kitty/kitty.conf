# ============================================
# Kitty Config - Thin wrapper for tmux
# ============================================
# Kitty handles: rendering, fonts, colors, clipboard
# Tmux handles: windows, panes, sessions

# Remote control (for Raycast scripts)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Shell - start tmux by default
shell /opt/homebrew/bin/fish

# Font configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback (tmux handles this, but keep some for non-tmux use)
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Window
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

# Tab bar - only shows when >= 2 tabs
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# macOS specific
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# ============================================
# Keybindings - Kitty basics only
# ============================================

# Copy/Paste (kitty handles clipboard)
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Font size (kitty handles rendering)
map cmd+plus  change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0

# Clear screen
map cmd+k combine : clear_terminal scrollback active : send_text normal \x0c

# ============================================
# Tmux passthrough - Cmd+ keys → tmux
# ============================================
# Prefix is Ctrl+Space = \x00

# --- Pane splits ---
# Cmd+\ → vertical split (prefix + \)
map cmd+\ send_text all \x00\\
# Cmd+Shift+\ → horizontal split (prefix + -)
map cmd+shift+\ send_text all \x00-
# Cmd+W → close pane (prefix + x)
map cmd+w send_text all \x00x

# --- Pane navigation ---
# Cmd+arrows → move between panes (sends Alt+arrows)
map cmd+left  send_text all \x1b[1;3D
map cmd+right send_text all \x1b[1;3C
map cmd+up    send_text all \x1b[1;3A
map cmd+down  send_text all \x1b[1;3B

# --- Pane resize ---
# Cmd+Shift+arrows → resize (prefix + HJKL)
map cmd+shift+left  send_text all \x00H
map cmd+shift+right send_text all \x00L
map cmd+shift+up    send_text all \x00K
map cmd+shift+down  send_text all \x00J

# --- Pane zoom ---
# Cmd+Shift+Enter → toggle zoom (prefix + z)
map cmd+shift+enter send_text all \x00z

# --- Window (tmux) switching ---
# Cmd+1-9 → switch tmux windows (sends Alt+1-9)
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9

# Cmd+Shift+]/[ → next/prev window (sends Shift+Right/Left)
map cmd+shift+] send_text all \x1b[1;2C
map cmd+shift+[ send_text all \x1b[1;2D

# --- Window management ---
# Cmd+T → new window (prefix + c)
map cmd+t send_text all \x00c
# Cmd+Shift+R → rename window (prefix + ,)
map cmd+shift+r send_text all \x00,

# --- Session management ---
# Cmd+S → session picker (prefix + s)
map cmd+s send_text all \x00s
# Cmd+Shift+N → new session (prefix + N)
map cmd+shift+n send_text all \x00N

# --- Copy mode ---
# Cmd+F → enter copy mode (prefix + Enter)
map cmd+f send_text all \x00\x0d

# --- Detach from tmux ---
# Cmd+D → detach (prefix + d)
map cmd+d send_text all \x00d

# ============================================
# Escape hatch - Kitty's own tabs (rarely needed)
# ============================================
# Ctrl+Cmd+ combos for when you need kitty tabs outside tmux
map ctrl+cmd+t       new_tab_with_cwd
map ctrl+cmd+w       close_tab
map ctrl+cmd+]       next_tab
map ctrl+cmd+[       previous_tab
map ctrl+cmd+1       goto_tab 1
map ctrl+cmd+2       goto_tab 2
map ctrl+cmd+3       goto_tab 3

# ============================================
# Line editing (shell input - works in tmux)
# ============================================
map cmd+backspace send_text all \x15
map alt+backspace send_text all \x17
map alt+left      send_text all \x1b\x62
map alt+right     send_text all \x1b\x66

# ============================================
