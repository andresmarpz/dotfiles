# Sandcastle Dark (based on Kurokula)

# Font rendering
font_size 13
text_composition_strategy 1.0 0
macos_thicken_font 0
adjust_column_width 0

# macOS title bar
macos_titlebar_color            #030303

# The basic colors
foreground              #e0cfc2
background              #030303
selection_foreground    #ffc34c
selection_background    #515151

# Cursor colors
cursor                  #7a1c1c
cursor_text_color       #fffbf2

# URL underline color when hovering
url_color               #596181

# Kitty window border colors
active_border_color     #5c91dd
inactive_border_color   #515151
bell_border_color       #e1b917

# Tab bar colors
active_tab_foreground   #030303
active_tab_background   #5c91dd
inactive_tab_foreground #867268
inactive_tab_background #333333
tab_bar_background      #030303

# Colors for marks
mark1_foreground #030303
mark1_background #5c91dd
mark2_foreground #030303
mark2_background #8b79a6
mark3_foreground #030303
mark3_background #78b3a9

# The 16 terminal colors
# black
color0  #333333
color8  #515151

# red
color1  #c35a52
color9  #ffc34c

# green
color2  #78b3a9
color10 #afffa5

# yellow
color3  #e1b917
color11 #fff700

# blue
color4  #5c91dd
color12 #90dbff

# magenta
color5  #8b79a6
color13 #ad93ff

# cyan
color6  #867268
color14 #ffcdb6

# white
color7  #e0cfc2
color15 #ffffff
